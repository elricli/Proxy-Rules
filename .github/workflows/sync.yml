# Pull upstream rule lists, merge overrides, export Clash ruleset, commit weekly.
name: Sync upstream lists

on:
  schedule:
    # Every Monday 03:00 UTC (= Beijing Monday 11:00)
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstreams and regenerate rules/
        run: python3 scripts/sync.py

      - name: Export combined Clash ruleset
        run: python3 scripts/export_clash.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/ clash/
          if git diff --cached --quiet; then
            echo "No rule changes this run."
            exit 0
          fi
          git commit -m "sync: refresh rules from upstream ($(date -u +%F))"
          git push
